<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="470" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" fill="#f0f6fc" font-size="18" font-weight="700">Memory &amp; ZRAM Swap: Stock vs. Tuned (907 MB Usable RAM)</text>
  <text x="32" y="62" fill="#8b949e" font-size="12">Measured via /proc/meminfo and dumpsys meminfo on JVC 32" (Vestel 17MB171 / MediaTek m5621)</text>

  <!-- Legend -->
  <rect x="620" y="26" width="14" height="14" rx="3" fill="#f85149"/>
  <text x="640" y="38" fill="#c9d1d9" font-size="12" font-weight="600">Stock (Before)</text>
  <rect x="745" y="26" width="14" height="14" rx="3" fill="#2ea043"/>
  <text x="765" y="38" fill="#c9d1d9" font-size="12" font-weight="600">Tuned (After)</text>

  <!-- Grid lines (0, 100, 200, 300, 400 MB) -> x from 260 to 660 (400px = 400 MB => 1.0px/MB) -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="4,4">
    <line x1="260" y1="85" x2="260" y2="425"/>
    <line x1="360" y1="85" x2="360" y2="425"/>
    <line x1="460" y1="85" x2="460" y2="425"/>
    <line x1="560" y1="85" x2="560" y2="425"/>
    <line x1="660" y1="85" x2="660" y2="425"/>
  </g>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="260" y="445">0 MB</text>
    <text x="360" y="445">100 MB</text>
    <text x="460" y="445">200 MB</text>
    <text x="560" y="445">300 MB</text>
    <text x="660" y="445">400 MB</text>
  </g>

  <!-- Row 1: MemAvailable (Cold Boot) [Higher is better] -->
  <text x="32" y="114" fill="#f0f6fc" font-size="13" font-weight="600">Available RAM (Cold Boot)</text>
  <text x="32" y="131" fill="#8b949e" font-size="11">Higher is better (+63.9%)</text>
  <!-- Stock: 223.9 MB -> 224px (ends at 484) -->
  <rect x="260" y="96" width="224" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="492" y="109" fill="#ff7b72" font-size="12" font-weight="600">223.9 MB (229,248 KB)</text>
  <!-- Tuned: 366.9 MB -> 367px (ends at 627) -->
  <rect x="260" y="118" width="367" height="18" rx="4" fill="#2ea043"/>
  <text x="635" y="131" fill="#56d364" font-size="12" font-weight="700">366.9 MB (+143 MB)</text>

  <!-- Row 2: MemAvailable (Live TV Active) [Higher is better] -->
  <text x="32" y="182" fill="#f0f6fc" font-size="13" font-weight="600">Available RAM (Live TV Active)</text>
  <text x="32" y="199" fill="#8b949e" font-size="11">Higher is better (+100.8%)</text>
  <!-- Stock: 180.7 MB -> 181px (ends at 441) -->
  <rect x="260" y="164" width="181" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="449" y="177" fill="#ff7b72" font-size="12" font-weight="600">180.7 MB (~185,000 KB)</text>
  <!-- Tuned: 362.8 MB -> 363px (ends at 623) -->
  <rect x="260" y="186" width="363" height="18" rx="4" fill="#2ea043"/>
  <text x="631" y="199" fill="#56d364" font-size="12" font-weight="700">362.8 MB (+182 MB)</text>

  <!-- Row 3: ZRAM Swap Used [Lower is better] -->
  <text x="32" y="250" fill="#f0f6fc" font-size="13" font-weight="600">ZRAM Swap Used</text>
  <text x="32" y="267" fill="#8b949e" font-size="11">Lower is better (-81.0%)</text>
  <!-- Stock: 384.3 MB -> 384px (ends at 644) -->
  <rect x="260" y="232" width="384" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="652" y="245" fill="#ff7b72" font-size="12" font-weight="600">384.3 MB (76.9% Swap)</text>
  <!-- Tuned: 73.0 MB -> 73px (ends at 333) -->
  <rect x="260" y="254" width="73" height="18" rx="4" fill="#2ea043"/>
  <text x="341" y="267" fill="#56d364" font-size="12" font-weight="700">73.0 MB (14.6% Swap)</text>

  <!-- Row 4: Home Launcher Footprint (PSS) [Lower is better] -->
  <text x="32" y="318" fill="#f0f6fc" font-size="13" font-weight="600">Home Launcher RAM (PSS)</text>
  <text x="32" y="335" fill="#8b949e" font-size="11">Lower is better (-79.3%)</text>
  <!-- Stock: 144.9 MB -> 145px (ends at 405) -->
  <rect x="260" y="300" width="145" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="413" y="313" fill="#ff7b72" font-size="12" font-weight="600">144.9 MB (Google TV Launcher)</text>
  <!-- Tuned: 30.0 MB -> 30px (ends at 290) -->
  <rect x="260" y="322" width="30" height="18" rx="4" fill="#2ea043"/>
  <text x="298" y="335" fill="#56d364" font-size="12" font-weight="700">30.0 MB (Projectivy Launcher)</text>

  <!-- Row 5: HbbTV + Play Store Resident Bloat [Lower is better] -->
  <text x="32" y="386" fill="#f0f6fc" font-size="13" font-weight="600">HbbTV + Play Store Background</text>
  <text x="32" y="403" fill="#8b949e" font-size="11">Lower is better (-100%)</text>
  <!-- Stock: 211.4 MB -> 211px (ends at 471) -->
  <rect x="260" y="368" width="211" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="479" y="381" fill="#ff7b72" font-size="12" font-weight="600">211.4 MB (159.5 MB HbbTV + 51.9 MB Store)</text>
  <!-- Tuned: 0 MB -> 4px indicator -->
  <rect x="260" y="390" width="4" height="18" rx="2" fill="#2ea043"/>
  <text x="272" y="403" fill="#56d364" font-size="12" font-weight="700">0 MB (Disabled)</text>
</svg>
