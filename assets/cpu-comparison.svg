<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 470" width="100%" height="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <rect width="880" height="470" rx="12" fill="#0d1117" stroke="#30363d" stroke-width="1.5"/>

  <!-- Header -->
  <text x="32" y="40" fill="#f0f6fc" font-size="18" font-weight="700">CPU Load &amp; Storage I/O Wait During Live TV: Stock vs. Tuned</text>
  <text x="32" y="62" fill="#8b949e" font-size="12">Lower is better. Measured via top -m 15 during DVB-T2 playback on 4x Cortex-A53 (MediaTek m5621)</text>

  <!-- Legend -->
  <rect x="620" y="26" width="14" height="14" rx="3" fill="#f85149"/>
  <text x="640" y="38" fill="#c9d1d9" font-size="12" font-weight="600">Stock (Before)</text>
  <rect x="745" y="26" width="14" height="14" rx="3" fill="#2ea043"/>
  <text x="765" y="38" fill="#c9d1d9" font-size="12" font-weight="600">Tuned (After)</text>

  <!-- Grid lines (0%, 25%, 50%, 75%, 100%) -> x from 260 to 660 (400px = 100% => 4.0px/%) -->
  <g stroke="#21262d" stroke-width="1" stroke-dasharray="4,4">
    <line x1="260" y1="85" x2="260" y2="425"/>
    <line x1="360" y1="85" x2="360" y2="425"/>
    <line x1="460" y1="85" x2="460" y2="425"/>
    <line x1="560" y1="85" x2="560" y2="425"/>
    <line x1="660" y1="85" x2="660" y2="425"/>
  </g>
  <g fill="#8b949e" font-size="11" text-anchor="middle">
    <text x="260" y="445">0%</text>
    <text x="360" y="445">25%</text>
    <text x="460" y="445">50%</text>
    <text x="560" y="445">75%</text>
    <text x="660" y="445">100%</text>
  </g>

  <!-- Row 1: Total Quad-Core CPU Busy -->
  <text x="32" y="114" fill="#f0f6fc" font-size="13" font-weight="600">Total 4-Core CPU Busy</text>
  <text x="32" y="131" fill="#8b949e" font-size="11">Normalized across 4 cores (400%)</text>
  <!-- Stock: 81.2% -> 325px (ends at 585) -->
  <rect x="260" y="96" width="325" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="593" y="109" fill="#ff7b72" font-size="12" font-weight="600">81.2% Busy (18.8% Idle)</text>
  <!-- Tuned: 1.4% net -> 10px (ends at 270) -->
  <rect x="260" y="118" width="10" height="18" rx="3" fill="#2ea043"/>
  <text x="278" y="131" fill="#56d364" font-size="12" font-weight="700">1.4% Net Busy (98.6% Free CPU)</text>

  <!-- Row 2: Backlight 50 Hz JNI Polling Loop (1-core %) -->
  <text x="32" y="182" fill="#f0f6fc" font-size="13" font-weight="600">Backlight 50 Hz JNI Loop</text>
  <text x="32" y="199" fill="#8b949e" font-size="11">BacklightService + mtktvapi + dtv_svc</text>
  <!-- Stock: 57.6% -> 230px (ends at 490) -->
  <rect x="260" y="164" width="230" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="498" y="177" fill="#ff7b72" font-size="12" font-weight="600">57.6% CPU (NI -10 @ 20 ms loop)</text>
  <!-- Tuned: 3.7% -> 15px (ends at 275) -->
  <rect x="260" y="186" width="15" height="18" rx="4" fill="#2ea043"/>
  <text x="283" y="199" fill="#56d364" font-size="12" font-weight="700">3.7% CPU (NI 19 @ 1000 ms idle)</text>

  <!-- Row 3: HbbTV Chromium Renderer (1-core %) -->
  <text x="32" y="250" fill="#f0f6fc" font-size="13" font-weight="600">HbbTV Chromium Renderer</text>
  <text x="32" y="267" fill="#8b949e" font-size="11">hbbtv_content_shell on DVB-T2</text>
  <!-- Stock: 90.0% -> 360px (ends at 620) -->
  <rect x="260" y="232" width="360" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="628" y="245" fill="#ff7b72" font-size="12" font-weight="600">90.0% CPU (163 MB RSS)</text>
  <!-- Tuned: 0% -> 4px -->
  <rect x="260" y="254" width="4" height="18" rx="2" fill="#2ea043"/>
  <text x="272" y="267" fill="#56d364" font-size="12" font-weight="700">0.0% CPU (HbbTV Off)</text>

  <!-- Row 4: Kernel Swap Daemon (kswapd0) -->
  <text x="32" y="318" fill="#f0f6fc" font-size="13" font-weight="600">Kernel Swap Daemon (kswapd0)</text>
  <text x="32" y="335" fill="#8b949e" font-size="11">ZRAM page reclaim thrashing</text>
  <!-- Stock: 27.7% -> 111px (ends at 371) -->
  <rect x="260" y="300" width="111" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="379" y="313" fill="#ff7b72" font-size="12" font-weight="600">27.7% CPU (Constant thrashing)</text>
  <!-- Tuned: 0% -> 4px -->
  <rect x="260" y="322" width="4" height="18" rx="2" fill="#2ea043"/>
  <text x="272" y="335" fill="#56d364" font-size="12" font-weight="700">0.0% CPU (No swap pressure)</text>

  <!-- Row 5: eMMC Storage I/O Wait (%iow) -->
  <text x="32" y="386" fill="#f0f6fc" font-size="13" font-weight="600">eMMC Storage I/O Wait (%iow)</text>
  <text x="32" y="403" fill="#8b949e" font-size="11">UI freeze bottleneck</text>
  <!-- Stock: 33.0% -> 132px (ends at 392) -->
  <rect x="260" y="368" width="132" height="18" rx="4" fill="#f85149" opacity="0.85"/>
  <text x="400" y="381" fill="#ff7b72" font-size="12" font-weight="600">33.0% I/O Wait</text>
  <!-- Tuned: 0% -> 4px -->
  <rect x="260" y="390" width="4" height="18" rx="2" fill="#2ea043"/>
  <text x="272" y="403" fill="#56d364" font-size="12" font-weight="700">0.0% I/O Wait</text>
</svg>
